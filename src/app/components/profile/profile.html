<div class="profile-page-container" *ngIf="auth.usuario() as user">
  <div class="profile-card-luxury">
    
    <!-- Cabeçalho com Avatar e Nome -->
    <header class="card-header">
      <div class="avatar-wrapper">
        <img [src]="user.picture || 'assets/default-avatar.png'" [alt]="versionService.ui().profileAvatarOf + ' ' + user.name">
      </div>
      <h1 class="cinzel-heading">{{ user.name }}</h1>
      <span class="membership-badge">{{ versionService.ui().profileRoyalCollectionMember }}</span>
    </header>

    <!-- Conteúdo Informativo -->
    <main class="card-body">
      <div class="info-section">
        <div class="info-group">
          <label>{{ versionService.ui().profileIdentityAddress }}</label>
          <p>{{ user.email }}</p>
        </div>
        
        <div class="info-group">
          <label>{{ versionService.ui().profileAccessStatus }}</label>
          <p class="status-indicator">{{ versionService.ui().profileSyncedViaGoogleCloud }}</p>
        </div>

        <div class="info-group">
          <label>{{ versionService.ui().profileSignupOrigin }}</label>
          <p>{{ versionService.ui().profileSignupOriginValue }}</p>
        </div>
      </div>
    </main>

    <!-- Ações de Saída -->
    <footer class="card-footer">
      <button class="btn-outline-gold">{{ versionService.ui().profileAccountSettings }}</button>
      <button class="btn-exit" (click)="auth.logout()">
        {{ versionService.ui().profileEndSessionCollection }}
      </button>
    </footer>

  </div>
</div>
