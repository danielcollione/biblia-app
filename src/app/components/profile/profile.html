<!-- 1. LOADING GLOBAL: Aparece sempre que isLoading for true -->
<div class="loading-overlay" *ngIf="auth.isLoading()">
  <div class="luxury-spinner"></div>
  <p class="loading-text">Sincronizando com o Acervo...</p>
</div>

<!-- 2. CONTEÚDO: Só aparece quando o loading termina e o usuário existe -->
<div class="profile-page-container" *ngIf="!auth.isLoading() && auth.usuario() as user">
  <div class="profile-card-luxury">
    
    <header class="card-header">
      <div class="avatar-wrapper">
        <!-- Tenta carregar a pictureUrl do DB, se não houver, usa a default -->
        <img [src]="user.pictureUrl || 'default-avatar.png'" 
             (error)="$any($event.target).src = 'default-avatar.png'"
             class="profile-avatar">
        <div class="level-tag">LVL {{ user.level }}</div>
      </div>
      <h1 class="user-name cinzel-heading">{{ user.name }}</h1>
      <div class="rank-badge">{{ user.cargo }}</div>
    </header>

    <main class="card-body">
      <div class="xp-container">
        <div class="xp-header">
          <span>Experiência</span>
          <span>{{ user.experiencia }} XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" [style.width.%]="(user.experiencia % 100)"></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="label">Identidade</span>
          <span class="value">{{ user.email }}</span>
        </div>
        <div class="stat-item">
          <span class="label">Status</span>
          <span class="value gold-text">Sincronizado via Google</span>
        </div>
      </div>
    </main>

    <footer class="card-footer">
      <button class="btn-exit" (click)="auth.logout()">Encerrar Sessão</button>
    </footer>
  </div>
</div>
