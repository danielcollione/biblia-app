<!-- O Loading aparece acima de tudo enquanto o back-end processa -->
<div class="loading-overlay" *ngIf="auth.isLoading()">
  <div class="luxury-spinner"></div>
  <p class="cinzel-heading">Validando sua entrada no acervo...</p>
</div>

<div class="profile-page-container" *ngIf="!auth.isLoading() && auth.usuario() as user">
  <div class="profile-card-luxury">
    
    <header class="card-header">
      <div class="avatar-wrapper">
        <!-- Lógica de Fallback para a imagem -->
        <img [src]="user.pictureUrl || 'default-avatar.png'" class="profile-avatar">
        <div class="level-badge">LVL {{ user.level }}</div>
      </div>
      <h1 class="cinzel-heading">{{ user.name }}</h1>
      <span class="membership-badge">{{ user.cargo }}</span>
    </header>

    <main class="card-body">
      <div class="xp-section">
        <div class="xp-text">
          <span>Experiência</span>
          <span>{{ user.experiencia }} XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" [style.width.%]="(user.experiencia % 100)"></div>
        </div>
      </div>

      <div class="info-section">
        <div class="info-group">
          <label>Identidade</label>
          <p>{{ user.email }}</p>
        </div>
        <div class="info-group">
          <label>Status</label>
          <p class="gold-text">Sincronizado com Google Cloud</p>
        </div>
      </div>
    </main>

    <footer class="card-footer">
      <button class="btn-exit" (click)="auth.logout()">Encerrar Sessão</button>
    </footer>
  </div>
</div>
