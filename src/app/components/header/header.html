<header class="main-header" [class.menu-active]="isMenuOpen()" [class.landing-top]="isLandingTop()">
    <div class="header-content">

        <div class="logo-left">
            <a routerLink="/" class="logo-link" (click)="closeMenu()">
                <img src="logo-sem-fundo.png" [alt]="versionService.ui().headerLogoAlt" class="header-logo">
            </a>
        </div>

        <button class="menu-toggle" (click)="toggleMenu()"
            [attr.aria-label]="versionService.ui().headerOpenMenuAriaLabel">
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>

        <nav class="nav-center">
            <ul class="nav-links">
                <li><a routerLink="/" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">{{versionService.ui().start}}</a></li>
                <li><a routerLink="/read" routerLinkActive="active-link">{{versionService.ui().title}}</a></li>
                <li><a routerLink="/login">{{ versionService.ui().entrar }}</a></li>

            </ul>

        </nav>

        <div class="header-actions">
            <div class="lang-selector">
                <app-version-selector></app-version-selector>
            </div>
        </div>

        <nav class="nav-mobile" [class.open]="isMenuOpen()">
            <ul class="nav-links-mobile">
                <li><a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                        (click)="closeMenu()">{{versionService.ui().start}}</a></li>
                <li><a routerLink="/read" routerLinkActive="active-link"
                        (click)="closeMenu()">{{versionService.ui().title}}</a></li>
                <li class="mobile-lang-selector"><app-version-selector></app-version-selector></li>
                <li><a routerLink="/login" (click)="closeMenu()">{{
                        versionService.ui().entrar }}</a></li>

            </ul>
        </nav>

    </div>
</header>

@if (isMenuOpen()) {
<div class="menu-overlay" (click)="closeMenu()"></div>
}
