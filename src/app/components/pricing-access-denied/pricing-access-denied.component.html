<section class="pricing-container" aria-live="polite">
  <div class="lock-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M12 16v2" />
    </svg>
  </div>

  <h2 class="access-denied-title">{{ versionService.ui().pricingAccessDeniedTitle }}</h2>
  
  <p class="access-denied-subtitle">
    {{ versionService.ui().pricingAccessDeniedSubtitle }}
    <strong class="resource-highlight">{{ resolvedResourceTitle }}</strong>
  </p>

  @if (hasResourceDescription) {
    <p class="resource-description">{{ deniedResourceDescription }}</p>
  }

  <button
    class="btn-premium"
    (click)="onSubscribe()"
    [disabled]="isStartingCheckout()">
    
    @if (isStartingCheckout()) {
      <span class="btn-loading-spinner"></span>
      <span>{{ versionService.ui().pricingAccessDeniedButtonLoading }}</span>
    } @else {
      <span>{{ versionService.ui().pricingAccessDeniedButton }}</span>
    }
  </button>
</section>
