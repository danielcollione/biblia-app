<div class="login-wrapper">
    <div class="login-card" [class.form-loading]="carregando()">

        <div class="brand-header">
            <div class="icon-book">📖</div>
            <h2>{{ versionService.ui().loginAccessCollection }}</h2>
            <p>{{ versionService.ui().loginContinueJourney }}</p>
        </div>

        <div class="error-alert" *ngIf="erroMensagem()">
            {{ erroMensagem() }}
        </div>

        <div class="google-btn-container" [class.disabled]="carregando()">
            <div id="google-btn-wrapper"></div>
        </div>

        <div class="google-only-note">
            <span>{{ versionService.ui().loginGoogleButtonText }}</span>
        </div>

    </div>
</div>
