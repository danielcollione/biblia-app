<div class="login-wrapper">
    <div class="login-card">

        <div class="brand-header">
            <div class="icon-book">📖</div>
            <h2>{{ isLoginMode ? 'Acesso ao Acervo' : 'Junte-se ao Acervo' }}</h2>
            <p>{{ isLoginMode ? 'Entre para continuar sua jornada.' : 'Crie sua conta para iniciar suas descobertas.' }}
            </p>
        </div>

        <div class="google-btn-container">
            <div id="google-btn-wrapper"></div>
        </div>

        <div class="divider">
            <span>OU USE SEU E-MAIL</span>
        </div>

        <!-- Criamos a variável authForm para o Angular monitorar tudo -->
        <form class="luxury-form" #authForm="ngForm" (ngSubmit)="onSubmitTradicional()">

            <div class="input-group" *ngIf="!isLoginMode">
                <label>Nome Completo</label>
                <!-- required: torna o campo obrigatório -->
                <input type="text" name="nome" [(ngModel)]="nome" required minlength="3"
                    placeholder="Como deseja ser chamado?">
            </div>

            <div class="input-group">
                <label>E-mail</label>
                <!-- required e email: obriga a ter texto e ter o @ -->
                <input type="email" name="email" [(ngModel)]="email" required email placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="senha" [(ngModel)]="senha" required minlength="6" placeholder="••••••••">
            </div>

            <div class="input-group" *ngIf="!isLoginMode">
                <label>Confirmar Senha</label>
                <input type="password" name="confirmarSenha" [(ngModel)]="confirmarSenha" required minlength="6"
                    placeholder="••••••••" [class.input-error]="erroSenha">
                <span class="error-msg" *ngIf="erroSenha">As senhas precisam ser idênticas.</span>
            </div>

            <!-- A TRAVA: O botão fica desativado se o formulário for inválido -->
            <button type="submit" class="btn-gold" [disabled]="authForm.invalid">
                {{ isLoginMode ? 'Entrar no Acervo' : 'Criar minha Conta' }}
            </button>
        </form>

        <div class="toggle-mode">
            <p *ngIf="isLoginMode">Ainda não tem uma conta? <a (click)="toggleMode()">Cadastre-se</a></p>
            <p *ngIf="!isLoginMode">Já possui uma conta? <a (click)="toggleMode()">Faça Login</a></p>
        </div>

    </div>
</div>
