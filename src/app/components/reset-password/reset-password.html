<div class="reset-wrapper">
  <div class="reset-card" [class.form-loading]="carregando()">
    <div class="brand-header">
      <div class="icon-book">🔐</div>
      <h2>{{ versionService.ui().resetPasswordTitle }}</h2>
      <p>{{ versionService.ui().resetPasswordSubtitle }}</p>
    </div>

    <form class="luxury-form" #resetForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="success-alert" *ngIf="sucessoMensagem()">
        {{ sucessoMensagem() }}
      </div>

      <div class="error-alert" *ngIf="erroMensagem()">
        {{ erroMensagem() }}
      </div>

      <div class="input-group">
        <label>{{ versionService.ui().resetPasswordNewPasswordLabel }}</label>
        <div class="input-wrapper">
          <input
            [type]="verSenha ? 'text' : 'password'"
            name="novaSenha"
            [(ngModel)]="novaSenha"
            required
            minlength="8"
            [disabled]="carregando()"
            [placeholder]="versionService.ui().loginPasswordPlaceholder"
          />
          <button type="button" class="eye-btn" [disabled]="carregando()" (click)="toggleVerSenha()">
            <svg *ngIf="verSenha" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!verSenha" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>{{ versionService.ui().resetPasswordConfirmPasswordLabel }}</label>
        <div class="input-wrapper">
          <input
            [type]="verConfirmarSenha ? 'text' : 'password'"
            name="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            required
            minlength="8"
            [disabled]="carregando()"
            [placeholder]="versionService.ui().loginPasswordPlaceholder"
          />
          <button type="button" class="eye-btn" [disabled]="carregando()" (click)="toggleVerConfirmarSenha()">
            <svg *ngIf="verConfirmarSenha" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="!verConfirmarSenha" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-gold" [disabled]="resetForm.invalid || carregando()">
        <span class="btn-content" [class.is-loading]="carregando()">
          <span class="btn-spinner" *ngIf="carregando()"></span>
          <span>{{ versionService.ui().resetPasswordSubmit }}</span>
        </span>
      </button>
    </form>

    <div class="back-to-login" [class.disabled]="carregando()">
      <a routerLink="/login">{{ versionService.ui().forgotPasswordBackToLogin }}</a>
    </div>
  </div>
</div>
