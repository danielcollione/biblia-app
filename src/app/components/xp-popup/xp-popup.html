@if (xpPopupService.activeToast(); as toast) {
  <section class="xp-popup" aria-live="polite" role="status">
    <div class="xp-popup-icon" aria-hidden="true">✦</div>
    <div class="xp-popup-copy">
      @if (toast.amount) {
        <strong>+{{ toast.amount }} XP</strong>
      }
      <span>{{ toast.message }}</span>
    </div>
  </section>
}
