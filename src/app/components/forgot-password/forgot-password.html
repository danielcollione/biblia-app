<div class="forgot-wrapper">
  <div class="forgot-card" [class.form-loading]="carregando()">
    <div class="brand-header">
      <div class="icon-book">📖</div>
      <h2>{{ versionService.ui().forgotPasswordTitle }}</h2>
      <p>{{ versionService.ui().forgotPasswordSubtitle }}</p>
    </div>

    <form class="luxury-form" #forgotForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="success-alert" *ngIf="sucessoMensagem()">
        {{ sucessoMensagem() }}
      </div>

      <div class="error-alert" *ngIf="erroMensagem()">
        {{ erroMensagem() }}
      </div>

      <div class="input-group">
        <label>{{ versionService.ui().loginEmail }}</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          [disabled]="carregando()"
          [placeholder]="versionService.ui().loginEmailPlaceholder"
        />
      </div>

      <button type="submit" class="btn-gold" [disabled]="forgotForm.invalid || carregando()">
        <span class="btn-content" [class.is-loading]="carregando()">
          <span class="btn-spinner" *ngIf="carregando()"></span>
          <span>{{ versionService.ui().forgotPasswordSubmit }}</span>
        </span>
      </button>
    </form>

    <div class="back-to-login" [class.disabled]="carregando()">
      <a routerLink="/login">{{ versionService.ui().forgotPasswordBackToLogin }}</a>
    </div>
  </div>
</div>
